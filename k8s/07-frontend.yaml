apiVersion: apps/v1
kind: Deployment
metadata:
  name: fithub-frontend
  namespace: fithub-campus
  labels:
    app: fithub-frontend
    app.kubernetes.io/component: web-spa
    app.kubernetes.io/part-of: fithub-campus-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fithub-frontend
  template:
    metadata:
      labels:
        app: fithub-frontend
        app.kubernetes.io/component: web-spa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: fithubcampus-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-web
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fithub-frontend
  namespace: fithub-campus
  labels:
    app: fithub-frontend
    app.kubernetes.io/component: web-spa
spec:
  type: ClusterIP
  selector:
    app: fithub-frontend
  ports:
    - name: http-web
      port: 80
      targetPort: 8080
