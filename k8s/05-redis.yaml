apiVersion: apps/v1
kind: Deployment
metadata:
  name: fithub-redis
  namespace: fithub-campus
  labels:
    app: fithub-redis
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: fithub-campus-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fithub-redis
  template:
    metadata:
      labels:
        app: fithub-redis
        app.kubernetes.io/component: message-broker
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fithub-redis
  namespace: fithub-campus
  labels:
    app: fithub-redis
    app.kubernetes.io/component: message-broker
spec:
  type: ClusterIP
  selector:
    app: fithub-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
