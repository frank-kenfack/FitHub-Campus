apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: fithub-campus
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fithub-campus-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data-pvc
  namespace: fithub-campus
  labels:
    app.kubernetes.io/component: media-storage
    app.kubernetes.io/part-of: fithub-campus-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
