# =============================================================================
# Pipeline CI/CD GitLab pour FitHub Campus (lint, test, build, deploy)
# Étapes : lint -> test -> build -> deploy (Staging auto / Production manuelle)
# =============================================================================

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: fithub_ci
  POSTGRES_USER: fithub_ci_user
  POSTGRES_PASSWORD: fithub_ci_password
  SECRET_KEY: "gitlab-ci-secret-key-fithub-campus-2026-secure"
  JWT_SECRET_KEY: "gitlab-ci-jwt-secret-key-fithub-2026-rfc7518"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip
    - frontend/node_modules/

# -----------------------------------------------------------------------------
# 1. LINT & VALIDATION STATIQUE
# -----------------------------------------------------------------------------
lint:backend:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir ruff==0.6.4
  script:
    - cd backend
    - ruff check app tests wsgi.py gunicorn_wsgi.py

lint:frontend:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# -----------------------------------------------------------------------------
# 2. TESTS AUTOMATISÉS (PostgreSQL 16 + Redis 7 + Pytest)
# -----------------------------------------------------------------------------
test:pytest:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: db
    - name: redis:7-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB"
    REDIS_URL: "redis://redis:6379/0"
    UPLOAD_FOLDER: "/tmp/fithub_ci_uploads"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir -r backend/requirements.txt
    - mkdir -p "$UPLOAD_FOLDER"
  script:
    - cd backend
    - flask --app wsgi:app db upgrade
    - pytest -v --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: backend/pytest-report.xml
    paths:
      - backend/pytest-report.xml
    expire_in: 7 days

# -----------------------------------------------------------------------------
# 3. BUILD & PUBLICATION DES IMAGES DOCKER MULTI-STAGES
# -----------------------------------------------------------------------------
build:docker-images:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/backend:latest" ./backend
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:latest" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        docker push "$CI_REGISTRY_IMAGE/backend:latest"
        docker push "$CI_REGISTRY_IMAGE/frontend:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------------------------------
# 4. DÉPLOIEMENT AUTOMATISÉ (Staging sur develop / Production manuelle sur main)
# -----------------------------------------------------------------------------
deploy:staging:
  stage: deploy
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client ansible && rm -rf /var/lib/apt/lists/*
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - ansible-playbook -i "$STAGING_INVENTORY" infra/ansible/deploy.yml -e "target_branch=develop"
  environment:
    name: staging
    url: https://staging.fithub-campus.fr
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $SSH_PRIVATE_KEY'

deploy:production:
  stage: deploy
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client ansible && rm -rf /var/lib/apt/lists/*
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - ansible-playbook -i "$PRODUCTION_INVENTORY" infra/ansible/deploy.yml -e "target_branch=main"
  environment:
    name: production
    url: https://fithub-campus.fr
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $SSH_PRIVATE_KEY'
