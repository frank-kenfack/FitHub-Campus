services:
  db:
    image: postgres:16-alpine
    container_name: fithub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fithub}
      POSTGRES_USER: ${POSTGRES_USER:-fithub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fithub_dev_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fithub_user} -d $${POSTGRES_DB:-fithub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fithub_net

  redis:
    image: redis:7-alpine
    container_name: fithub-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fithub_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fithub-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://fithub_user:fithub_dev_pwd@db:5432/fithub}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-fithub-campus-dev-secret-key-2026-secure}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-fithub-campus-dev-jwt-secret-key-2026-rfc7518}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-/app/uploads}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/uploads
      - ./k8s:/app/k8s:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - fithub_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fithub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - fithub_net

volumes:
  postgres_data:
  uploads_data:

networks:
  fithub_net:
    driver: bridge
